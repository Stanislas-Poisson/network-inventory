[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-inventory"
version = "0.0.0"
description = "Home network inventory as a source of truth, compared with a LAN scan."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["Flask>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
network-inventory = "network_inventory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.setuptools.package-data]
network_inventory = ["migrations/*.sql", "web/templates/*.html", "web/static/*"]
