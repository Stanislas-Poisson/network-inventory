name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did and what you saw. Please remove anything private (MAC addresses, IPs, device names).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Commit of this repository, system (Raspberry Pi, WSL or other), Python version.
