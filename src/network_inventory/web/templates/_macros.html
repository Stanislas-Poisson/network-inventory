{% macro csrf() %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% endmacro %}

{% macro group_fields(form) %}
  <label>Name <input name="name" value="{{ form.get('name', '') }}" required></label>
  <label>First IP <input name="first_ip" value="{{ form.get('first_ip', '') }}" inputmode="decimal" required></label>
  <label>Last IP <input name="last_ip" value="{{ form.get('last_ip', '') }}" inputmode="decimal" required></label>
  <label class="check"><input type="checkbox" name="is_free"{% if form.get('is_free') %} checked{% endif %}> Free range (new devices get an address here)</label>
{% endmacro %}

{% macro wifi_fields(form, securities, password_hint="") %}
  <label>Network name (SSID) <input name="ssid" value="{{ form.get('ssid', '') }}" maxlength="32" required></label>
  <label>Security
    <select name="security">
      {% for key, label in securities.items() %}
        <option value="{{ key }}"{% if key == form.get('security') %} selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Key <input type="password" name="password" autocomplete="new-password" placeholder="{{ password_hint }}"></label>
  <label class="check"><input type="checkbox" name="hidden"{% if form.get('hidden') %} checked{% endif %}> Hidden network</label>
  <label>Notes <textarea name="notes" rows="2">{{ form.get('notes', '') }}</textarea></label>
{% endmacro %}
